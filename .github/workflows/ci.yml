name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  LLM_API_KEY: ""
  OPENAI_API_KEY: ""

defaults:
  run:
    shell: bash

jobs:
  unit-and-holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install pip-audit==2.10.1
      - name: Dependency inventory and consistency audit
        run: |
          mkdir -p evidence
          python -m pip check | tee evidence/pip-check.txt
          python -m pip list --format=json > evidence/python-packages.json
          pip-audit --requirement requirements.txt --format=json --output=evidence/pip-audit.json
      - name: Full unit suite
        run: python -m unittest discover -s tests -v 2>&1 | tee evidence/unittest.log
      - name: JavaScript syntax
        run: |
          find static -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done 2>&1 | tee evidence/node-check.log
      - name: Independent RAG holdout
        run: python scripts/evaluate_holdout.py | tee evidence/rag-holdout.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: unit-holdout-evidence
          path: evidence/

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: lureai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d lureai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://ci:ci-password@127.0.0.1:5432/lureai_ci
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - run: mkdir -p evidence && python -m unittest tests.test_replica_integration -v 2>&1 | tee evidence/postgres-integration.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: postgres-evidence
          path: evidence/

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Build traceable non-root image
        run: |
          mkdir -p evidence
          build_timestamp="$(git show -s --format=%cI HEAD)"
          docker build \
            --build-arg APP_BUILD_COMMIT="${GITHUB_SHA}" \
            --build-arg APP_BUILD_TIMESTAMP="${build_timestamp}" \
            --tag lureai:ci . 2>&1 | tee evidence/docker-build.log
          docker image inspect lureai:ci > evidence/docker-inspect.json
          docker run --rm lureai:ci sh -c \
            'test "$(id -u)" = 10001 && touch /app/data/write-test /app/qa/write-test'
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: container-evidence
          path: evidence/

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Start disposable application
        env:
          USER_USERNAME: tester
          USER_PASSWORD: test-password-for-browser
          USER_ROLE: admin
          APP_BUILD_COMMIT: ${{ github.sha }}
          APP_BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp || 'unknown' }}
        run: |
          mkdir -p evidence
          python run.py --port 8765 >evidence/server.log 2>&1 &
          echo $! > evidence/server.pid
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8765/api/health && exit 0
            sleep 1
          done
          cat evidence/server.log
          exit 1
      - name: Browser smoke
        env:
          BROWSER_BASE_URL: http://127.0.0.1:8765
          BROWSER_USERNAME: tester
          BROWSER_PASSWORD: test-password-for-browser
          BROWSER_ARTIFACT_DIR: evidence/browser
        run: python tests/browser_smoke.py 2>&1 | tee evidence/browser-smoke.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-evidence
          path: evidence/
