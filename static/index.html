<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- 深色模式下沒有對應的 theme-color 時，iOS 會用系統灰底畫狀態列，
       頁面是白的就會出現一條分割線；兩種模式都指定白色並鎖定淺色配色。 -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LUREAI">
  <title>LUREAI 你的智慧大腦中心</title>
  <link rel="icon" href="favicon.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="app-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <section id="login-gate" class="login-gate" aria-labelledby="login-title">
    <form id="login-form" class="login-panel">
      <img class="login-logo" src="logo.png" alt="lure ai">
      <div class="login-heading">
        <h1 id="login-title" class="login-tagline">Your Private Brain</h1>
      </div>
      <label for="login-username">帳號</label>
      <div class="login-field"><i data-lucide="user"></i><input id="login-username" name="username" autocomplete="username" required></div>
      <label for="login-password">密碼</label>
      <div class="login-field"><i data-lucide="lock-keyhole"></i><input id="login-password" name="password" type="password" autocomplete="current-password" required></div>
      <button id="login-button" class="command-button login-button" type="submit"><i data-lucide="log-in"></i><span>登入</span></button>
      <p id="login-status" class="login-status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <div id="app-shell" class="app-shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="對話側邊欄">
      <div class="brand-row">
        <img class="brand-logo" src="logo.png" alt="lure ai">
        <button class="icon-button sidebar-search" id="sidebar-search" type="button" title="搜尋對話" aria-label="搜尋對話"><i data-lucide="search"></i></button>
        <button class="icon-button sidebar-panel" id="sidebar-panel" type="button" title="收合側邊欄" aria-label="收合側邊欄"><i data-lucide="panel-left-close"></i></button>
        <button class="icon-button sidebar-close" id="sidebar-close" title="關閉側邊欄" aria-label="關閉側邊欄"><i data-lucide="x"></i></button>
      </div>
      <label class="conversation-search" id="conversation-search" hidden>
        <i data-lucide="search"></i>
        <input id="conversation-search-input" type="search" placeholder="搜尋對話" aria-label="搜尋最近對話">
      </label>
      <nav class="primary-nav" aria-label="主要功能">
        <button class="primary-nav-item" id="new-chat" type="button"><i data-lucide="square-pen"></i><span>新對話</span></button>
      </nav>
      <div class="sidebar-label">最近</div>
      <nav id="conversation-list" class="conversation-list" aria-label="最近對話"></nav>
      <div class="sidebar-footer">
        <div id="account-menu" class="account-modal" hidden role="dialog" aria-modal="true" aria-label="帳號選單">
          <button class="account-backdrop" id="account-backdrop" type="button" aria-label="關閉帳號選單"></button>
          <div class="account-card">
            <nav class="account-side" aria-label="帳號選單分頁">
              <button class="account-tab active" type="button" data-tab="settings"><i data-lucide="sliders-horizontal"></i><span>設定</span></button>
              <button class="account-tab" type="button" data-tab="usage"><i data-lucide="chart-pie"></i><span>用量</span></button>
            </nav>
            <div class="account-content">
              <button id="account-close" class="icon-button account-close" type="button" title="關閉" aria-label="關閉帳號選單"><i data-lucide="x"></i></button>
              <div id="account-panel-settings" class="account-panel">
                <h3 class="account-heading">語氣設定</h3>
                <div class="tone-toggle" id="tone-toggle" role="group" aria-label="語氣設定">
                  <button type="button" class="tone-option active" data-tone="expert" aria-pressed="true" title="專家模式：完整條列、講深講透">專家</button>
                  <button type="button" class="tone-option" data-tone="service" aria-pressed="false" title="客服模式：像真人聊天，一句一句回">客服</button>
                </div>
                <p class="account-hint">專家：完整條列、講深講透<br>客服：像真人聊天、一句一句回</p>
              </div>
              <div id="account-panel-usage" class="account-panel" hidden>
                <h3 class="account-heading">本月用量</h3>
                <section class="usage-panel" aria-labelledby="usage-title">
                  <div class="usage-heading"><span id="usage-title">本月用量</span><strong id="usage-percent">0%</strong></div>
                  <div class="usage-track" role="progressbar" aria-label="本月預算用量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="usage-progress"></span></div>
                  <strong id="usage-spend" class="usage-spend">NT$0 / NT$0</strong>
                  <span id="usage-tokens" class="usage-tokens">0 tokens</span>
                </section>
              </div>
            </div>
          </div>
        </div>
        <div class="user-account">
          <button class="account-trigger" id="user-account" type="button" aria-haspopup="true" aria-expanded="false" title="帳號選單">
            <div id="profile-avatar" class="profile-avatar" aria-hidden="true">U</div>
            <div class="profile-copy"><strong id="user-name">使用者</strong><span id="index-scope" hidden>索引已隔離</span></div>
          </button>
          <a id="admin-link" class="icon-button" href="/admin" target="_blank" rel="noopener" title="設定（另開分頁）" aria-label="設定（另開分頁）" hidden><i data-lucide="settings"></i></a>
          <button id="logout-button" class="icon-button" type="button" title="登出" aria-label="登出"><i data-lucide="log-out"></i></button>
        </div>
      </div>
    </aside>

    <main class="chat-main" id="chat-main">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-button" title="開啟側邊欄" aria-label="開啟側邊欄"><i data-lucide="panel-left"></i></button>
        <div class="topbar-title" id="topbar-title">
          <h1 id="conversation-title">新對話</h1>
          <input id="conversation-title-input" class="title-input" maxlength="40" aria-label="編輯對話名稱" hidden>
          <button id="rename-conversation" class="icon-button rename-button" type="button" title="編輯名稱" aria-label="編輯對話名稱"><i data-lucide="pencil"></i></button>
        </div>
        <button id="tone-indicator" class="tone-indicator" type="button" title="目前的回覆模式，點擊快速切換">專家模式</button>
        <div id="tone-confirm" class="tone-confirm" role="dialog" aria-label="切換回覆模式" hidden>
          <p id="tone-confirm-text">是否切換為客服模式？</p>
          <div class="tone-confirm-actions">
            <button id="tone-confirm-cancel" class="tone-cancel" type="button">取消</button>
            <button id="tone-confirm-ok" class="command-button tone-ok" type="button">切換</button>
          </div>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <div class="composer-shell">
        <form id="composer" class="composer">
          <textarea id="prompt" rows="1" maxlength="1200" placeholder="輸入輔導問題" aria-label="輸入問題"></textarea>
          <button id="stop-button" class="composer-action stop-action" type="button" title="停止產生" aria-label="停止產生" hidden><i data-lucide="square"></i></button>
          <button id="send-button" class="composer-action send-action" type="submit" title="送出訊息" aria-label="送出訊息"><i data-lucide="arrow-up"></i></button>
        </form>
      </div>
    </main>

    <aside id="source-drawer" class="source-drawer" aria-label="來源資料" aria-hidden="true">
      <div class="drawer-header">
        <div><span class="eyebrow">SOURCE</span><h2>回答來源</h2></div>
        <button class="icon-button" id="source-close" title="關閉來源" aria-label="關閉來源"><i data-lucide="x"></i></button>
      </div>
      <div id="source-content" class="source-content"></div>
    </aside>
    <button id="drawer-overlay" class="drawer-overlay" aria-label="關閉面板" hidden></button>
  </div>
  <script src="vendor/lucide.min.js"></script>
  <script src="chat.js"></script>
</body>
</html>
