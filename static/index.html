<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20211e">
  <title>張副總 AI 客服</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="對話側邊欄">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">張</div>
        <div><strong id="brand-title">客服知識台</strong><span>Grounded RAG</span></div>
        <button class="icon-button sidebar-close" id="sidebar-close" title="關閉側邊欄" aria-label="關閉側邊欄"><i data-lucide="x"></i></button>
      </div>
      <button class="new-chat-button" id="new-chat" type="button"><i data-lucide="square-pen"></i><span>新增對話</span></button>
      <div class="sidebar-label">最近對話</div>
      <nav id="conversation-list" class="conversation-list" aria-label="最近對話"></nav>
      <div class="sidebar-footer">
        <a href="admin.html" class="sidebar-link"><i data-lucide="settings-2"></i><span>知識庫管理</span></a>
        <div class="privacy-note"><i data-lucide="shield-check"></i><span id="index-scope">客服索引已隔離</span></div>
      </div>
    </aside>

    <main class="chat-main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button menu-button" id="menu-button" title="開啟側邊欄" aria-label="開啟側邊欄"><i data-lucide="panel-left"></i></button>
          <div><h1 id="conversation-title">新對話</h1><span class="topbar-subtitle" id="app-subtitle">張副總 AI 客服</span></div>
        </div>
        <div class="service-status" id="service-status"><span class="status-dot"></span><span>連線中</span></div>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <div class="composer-shell">
        <form id="composer" class="composer">
          <textarea id="prompt" rows="1" maxlength="1200" placeholder="輸入客服問題" aria-label="輸入問題"></textarea>
          <button id="stop-button" class="composer-action stop-action" type="button" title="停止產生" aria-label="停止產生" hidden><i data-lucide="square"></i></button>
          <button id="send-button" class="composer-action send-action" type="submit" title="送出訊息" aria-label="送出訊息"><i data-lucide="arrow-up"></i></button>
        </form>
        <div class="composer-meta"><span id="knowledge-scope">回答僅使用已核准知識</span><span id="char-count">0 / 1200</span></div>
      </div>
    </main>

    <aside id="source-drawer" class="source-drawer" aria-label="來源資料" aria-hidden="true">
      <div class="drawer-header">
        <div><span class="eyebrow">SOURCE</span><h2>回答來源</h2></div>
        <button class="icon-button" id="source-close" title="關閉來源" aria-label="關閉來源"><i data-lucide="x"></i></button>
      </div>
      <div id="source-content" class="source-content"></div>
    </aside>
    <button id="drawer-overlay" class="drawer-overlay" aria-label="關閉面板" hidden></button>
  </div>
  <script src="vendor/lucide.min.js"></script>
  <script src="chat.js"></script>
</body>
</html>
